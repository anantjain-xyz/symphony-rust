[workspace]
members = [
  "crates/symphony-agents",
  "crates/symphony-core",
  "crates/symphony-storage",
  "crates/symphony-tracker",
  "crates/symphony-worker",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.10"
authors = ["Anant Jain"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
keyring = "4.0.1"
keyring-core = "1.0.0"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
specta = { version = "1.0.5", features = ["chrono", "uuid"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "json"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
which = "8.0"
