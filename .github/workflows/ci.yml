name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't stack up minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Linux is billed at 1x; macOS is 10x and nothing here needs it (no bundle build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache the cargo registry + target dir so we don't recompile the world each run.
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      # validation/contract.json owns the ordered gate. The full profile keeps
      # symphony-desktop excluded from Linux Rust checks to avoid webkit2gtk.
      - run: pnpm verify:full
      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-e2e-screenshots
          path: test-results/**/*.png
          if-no-files-found: error
