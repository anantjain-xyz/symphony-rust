name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't stack up minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Linux is billed at 1x; macOS is 10x and nothing here needs it (no bundle build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Baseline verifiers compare exceptions with the pull request's base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache the cargo registry + target dir so we don't recompile the world each run.
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm install:hygiene-tools
      - run: pnpm check:hygiene
        env:
          # On main pushes, compare baseline exceptions with the pre-push SHA.
          BIOME_FORMAT_BASE_REF: ${{ github.event.before }}
      - run: pnpm test:hygiene

      # Architecture
      - run: pnpm check:boundaries
      - run: pnpm test:boundaries
      - run: pnpm test:runtime-contracts

      # Rust: pure crates only. Excluding symphony-desktop (the Tauri shell) avoids
      # webkit2gtk system deps and keeps the job fast and apt-free.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude symphony-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude symphony-desktop

      # Frontend
      - run: pnpm check:frontend-contracts
      - run: pnpm test:frontend-contracts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm test:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-e2e-screenshots
          path: test-results/**/*.png
          if-no-files-found: error
